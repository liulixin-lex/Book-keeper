# Base stack: PostgreSQL 18 + API + worker (docs/10-security-operations.md §2).
name: bookkeeper

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bookkeeper
      POSTGRES_USER: bk_owner
      POSTGRES_PASSWORD: ${BK_OWNER_DB_PASSWORD:?set BK_OWNER_DB_PASSWORD}
      BK_APP_DB_PASSWORD: ${BK_APP_DB_PASSWORD:?set BK_APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bk_owner", "-d", "bookkeeper"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ${BK_IMAGE:-ghcr.io/liulixin-lex/book-keeper:2.1.0}
    command: ["bookkeeper", "migrate"]
    env_file: .env
    environment:
      BK_MIGRATION_DATABASE_URL: postgresql+psycopg://bk_owner:${BK_OWNER_DB_PASSWORD}@db:5432/bookkeeper
    depends_on:
      db: { condition: service_healthy }
    healthcheck: { disable: true }   # one-shot job; the image healthcheck polls the API
    restart: "no"

  api:
    image: ${BK_IMAGE:-ghcr.io/liulixin-lex/book-keeper:2.1.0}
    # Requests reach the container from the Docker bridge, not 127.0.0.1; the port is published on the
    # host loopback only (nginx is the sole client), so its X-Forwarded-For can be trusted for client IPs.
    command: ["bookkeeper", "serve", "--host", "0.0.0.0", "--port", "8000", "--forwarded-allow-ips", "*"]
    env_file: .env
    environment:
      BK_DATABASE_URL: postgresql+psycopg://bk_app:${BK_APP_DB_PASSWORD}@db:5432/bookkeeper
    volumes:
      - data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    image: ${BK_IMAGE:-ghcr.io/liulixin-lex/book-keeper:2.1.0}
    command: ["bookkeeper", "worker"]
    healthcheck:
      test: ["CMD", "bookkeeper", "healthcheck", "--worker"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    env_file: .env
    environment:
      BK_DATABASE_URL: postgresql+psycopg://bk_app:${BK_APP_DB_PASSWORD}@db:5432/bookkeeper
    volumes:
      - data:/data
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

volumes:
  pgdata: {}
  data: {}
