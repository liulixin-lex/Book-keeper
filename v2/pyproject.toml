[project]
name = "bookkeeper"
version = "2.0.0"
description = "Double-entry bookkeeping backend with REST API and MCP server"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.44",
    "psycopg[binary]>=3.2.12",
    "alembic>=1.17",
    "argon2-cffi>=25.1",
    "python-multipart>=0.0.20",
    "mcp>=2.3",
    "openpyxl>=3.1",
    "anthropic>=1",
    "pypdf>=6",
    "openai>=3.35",
    "jsonschema>=4.26",
    "cryptography>=50",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "hypothesis>=6.140",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
    "httpx2>=2.13.1",
    "beancount>=3.1",
    "types-jsonschema>=4.26.0.20261006",
]

[project.scripts]
bookkeeper = "bookkeeper.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookkeeper"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "SIM", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/bookkeeper/mcp_api/content.py" = ["E501"]  # prose for AI clients
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "PT018", "E741"]
"tests/api/test_legacy_migration.py" = ["E501"]  # SQL fixture literals
"migrations/**" = ["E501"]
"scripts/**" = ["E501", "S106"]  # benchmark: long SQL literals, throwaway credentials

[tool.mypy]
python_version = "3.14"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["bookkeeper.domain.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: requires a PostgreSQL database"]
filterwarnings = ["error::DeprecationWarning:bookkeeper.*"]
