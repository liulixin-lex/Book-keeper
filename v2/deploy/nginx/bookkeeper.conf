# Snippet for the v2 server block. The API container also serves the web app (BK_WEB_DIR), so every path
# goes to it; the specific locations below only add per-path proxy settings. Until the v2 frontend replaces v1, use a separate host
# (v1 also serves /api/ on bill.example.com). Port = BK_HOST_PORT (8010 while v1 runs).
# X-Forwarded-For is overwritten, not appended: nginx is the edge and the app trusts the header for client
# IPs (rate limits, audit). Behind a CDN, configure real_ip (set_real_ip_from / real_ip_header) first.
location /api/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 30m;
    # AI 识别 runs on the worker, so uploads return at once; this only backstops slow uploads and large exports.
    proxy_read_timeout 300s;
}

location = /healthz { proxy_pass http://127.0.0.1:8010; }
location = /readyz  { proxy_pass http://127.0.0.1:8010; }

# MCP (Streamable HTTP): no buffering, long reads.
location /mcp {
    proxy_pass http://127.0.0.1:8010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# OAuth 2.1 sign-in for remote MCP clients (claude.ai, ChatGPT…), when BK_OAUTH_ENABLED=true.
location /.well-known/oauth- {
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /oauth/ {
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Web app (index.html is no-cache; /assets/* are content-hashed and cached for a year by the app).
location / {
    proxy_pass http://127.0.0.1:8010;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
