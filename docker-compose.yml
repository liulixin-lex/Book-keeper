name: book-keeper

services:
  api:
    image: ghcr.io/liulixin-lex/book-keeper:${BOOK_KEEPER_VERSION:-0.1.1}
    build: .
    restart: unless-stopped
    command:
      - sh
      - -c
      - ledger-admin init-db && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      DATABASE_URL: sqlite:////app/data/ledger.db
      BACKUP_DIR: /app/backups
      SESSION_COOKIE_SECURE: "true"
      AI_DEFAULT_BASE_URL: https://api.aiaimax.com/v1
      AI_DEFAULT_PROTOCOL: responses
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_DEFAULT_EFFORT: ${AI_DEFAULT_EFFORT:-medium}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      OPENEXCHANGERATES_APP_ID: ${OPENEXCHANGERATES_APP_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - ledger-data:/app/data
      - ledger-backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  worker:
    image: ghcr.io/liulixin-lex/book-keeper:${BOOK_KEEPER_VERSION:-0.1.1}
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: production
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
      DATABASE_URL: sqlite:////app/data/ledger.db
      BACKUP_DIR: /app/backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      KNOWLEDGE_WORKER_INTERVAL_SECONDS: ${KNOWLEDGE_WORKER_INTERVAL_SECONDS:-5}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    volumes:
      - ledger-data:/app/data
      - ledger-backups:/app/backups
    depends_on:
      api:
        condition: service_healthy

volumes:
  ledger-data:
  ledger-backups:
