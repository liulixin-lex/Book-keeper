name: Publish container image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Docker with the containerd image store
        uses: docker/setup-docker-action@v5
        with:
          version: latest
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v4
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/book-keeper
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build final image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: book-keeper-smoke:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Smoke test final image
        env:
          IMAGE: book-keeper-smoke:${{ github.sha }}
        run: bash .github/scripts/smoke-test-image.sh
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          SOURCE_IMAGE: book-keeper-smoke:${{ github.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "${tag}" ]; then
              docker tag "${SOURCE_IMAGE}" "${tag}"
              docker push "${tag}"
            fi
          done <<< "${TAGS}"
